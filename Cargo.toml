[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/lexicon",
    "crates/lm-ngram",
    "crates/lm-neural",
    "crates/engine",
    "crates/animed",
    "crates/eval",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

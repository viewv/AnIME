# AnIME 100% 开源洁净数据源登记表（遵循 .agents/contracts/data-format.md）
version: 1

sources:
  - id: scowl
    status: ready
    description: "Spell Checker Oriented Word Lists — 规范英文词形基础表（含美/英拼写分级与屈折变化）"
    source_url: "https://downloads.sourceforge.net/project/wordlist/SCOWL/2020.12.07/scowl-2020.12.07.tar.gz"
    version: "2020.12.07"
    license: "MIT / BSD-like (SCOWL permissive custom)"
    sha256: "5587667caa20c4891390c2d42dbb4d5c4c3f41bee77af1457ece3ba23fb859cc"
    build_script: "scripts/data_pipeline/build_lexicon.py"
    notes: "过滤生僻词等级（默认 <= 70），作为合法英文词汇白名单基准，防止误词进入候选"

  - id: wordfreq-en
    status: ready
    description: "wordfreq English multi-source Zipf word frequencies（覆盖 Wikipedia / Reddit / Twitter / OpenSubtitles 等现代语料）"
    source_url: "https://files.pythonhosted.org/packages/py3/w/wordfreq/wordfreq-3.1.1-py3-none-any.whl"
    version: "3.1.1"
    license: "Apache-2.0 (code) / CC-BY-SA-4.0 (compiled frequency lists)"
    sha256: "4b1c6ecffc6198be3396d5cf871c4423ca71c907c231348d352dd54d62b97473"
    build_script: "scripts/data_pipeline/build_lexicon.py"
    notes: "提供现代词频并覆盖 kubernetes、chatgpt 等新词；通过纯标准库解包 wheel 内置 cBpack 词频表与 SCOWL 取交集与补丁"

  - id: wikipedia-common-misspellings
    status: ready
    description: "Wikipedia 公开常见英文人类拼写错误映射表（For_machines 固定快照，如 definately -> definitely）"
    source_url: "https://en.wikipedia.org/w/index.php?title=Wikipedia:Lists_of_common_misspellings/For_machines&oldid=1199637275&action=raw"
    version: "oldid-1199637275"
    license: "CC-BY-SA-4.0"
    sha256: "3b6a9290e5aaad968da7ec769a5174adb45247688ef7ae097fd2dd80237a3050"
    build_script: "scripts/data_pipeline/build_misspellings.py"
    notes: "明确排除 Birkbeck（CC-BY-NC-SA-3.0 非商用）；CC-BY-SA-4.0 仅用于独立可审查错拼词表并按 80/20 切分（train 入库 / eval 评测防泄漏）"

  - id: crate-ci-typos
    status: ready
    description: "crate-ci/typos 开源英文真实拼写错误词典 CSV（覆盖开发与通用场景常见错拼）"
    source_url: "https://raw.githubusercontent.com/crate-ci/typos/v1.32.0/crates/typos-dict/assets/words.csv"
    version: "v1.32.0"
    license: "MIT OR Apache-2.0"
    sha256: "3630b7c12bf3a860ec2b7bd9b7a5e2e992dbb09936359c292d3be2762f7bd30d"
    build_script: "scripts/data_pipeline/build_misspellings.py"
    notes: "采用确定性哈希按 80/20 切分：train 切分用于错拼库，eval 切分专用于离线真实错拼评测，零重合防泄漏"

  - id: multiwoz-2.2-test-001
    status: ready
    description: "MultiWOZ 2.2 多领域英文对话测试集分片 001（真实自然英文人机对话语料）"
    source_url: "https://raw.githubusercontent.com/budzianowski/multiwoz/fe0c8e65cfcd8462bd33c86e35f21addc84ca82b/data/MultiWOZ_2.2/test/dialogues_001.json"
    version: "2.2-fe0c8e65"
    license: "MIT"
    sha256: "d6f43876cf130fdb2dfa8f96bc056b0995354137f02122e004925d01264ed386"
    build_script: "scripts/data_pipeline/build_eval_benchmark.py"
    notes: "用于提取真实语境真词消歧（context_realword）与真实英文对话整句（sentence）离线评测样本；亦为 build_eval_v2.py 生成 noise_v1 的源句（严禁进入任何训练语料）"

  - id: multiwoz-2.2-test-002
    status: ready
    description: "MultiWOZ 2.2 多领域英文对话测试集分片 002（真实自然英文人机对话语料）"
    source_url: "https://raw.githubusercontent.com/budzianowski/multiwoz/fe0c8e65cfcd8462bd33c86e35f21addc84ca82b/data/MultiWOZ_2.2/test/dialogues_002.json"
    version: "2.2-fe0c8e65"
    license: "MIT"
    sha256: "89af95d8f596a448e733d59b31be78f1dd1632eddd99d5cb298a3fcb1ac9d185"
    build_script: "scripts/data_pipeline/build_eval_benchmark.py"
    notes: "与 multiwoz-2.2-test-001 共同构成完整 MultiWOZ 2.2 test 分片"

  - id: ngram-corpus
    status: ready
    description: "OpenSLR 11 LibriSpeech 规范化英文语言模型语料（源自 Public Domain Project Gutenberg 书库），统计 2-gram 与 3-gram 概率表（ANIMENGR）"
    source_url: "https://www.openslr.org/resources/11/librispeech-lm-norm.txt.gz"
    version: "openslr-11"
    license: "Public Domain"
    sha256: "927d47656638c2ca93566640e56bcbeb2aa4ca237b8490fe1eff7d6e610a53c7"
    build_script: "scripts/data_pipeline/build_ngram_kn.py"
    notes: "全量 4041 万行经 build_ngram_kn.py（Rust anime-ngram-build：插值修正 Kneser-Ney + 计数剪枝 + eval/** 整句与 5-gram 去泄漏）编译为 ANIMENGR v1。注意源文件按字母序排序，截断前 N 行会严重偏向以 A 开头的句子；旧 build_ngram.py --max-lines 仅保留作小规模测试"

  - id: smollm2-360m-q4_k_m
    status: ready
    description: "HuggingFaceTB/SmolLM2-360M Base Q4_K_M GGUF（362M 参数 LLaMA 系 Decoder-only 小模型，L3 英文重排与续写主验证模型）"
    source_url: "https://huggingface.co/QuantFactory/SmolLM2-360M-GGUF/resolve/main/SmolLM2-360M.Q4_K_M.gguf"
    version: "SmolLM2-360M-Q4_K_M"
    license: "Apache-2.0"
    sha256: "be3035f2b21abe1038dbb1b9212791353715020bbc71265bde00da129ec320e6"
    build_script: "scripts/data_pipeline/fetch_models.py"
    notes: "Apache-2.0 开源基座模型，通过 llama.cpp Vulkan GPU 后端进行前缀 KV-Cache 复用打分与续写预测"

  - id: smollm2-135m-q4_k_m
    status: ready
    description: "HuggingFaceTB/SmolLM2-135M Base Q4_K_M GGUF（135M 参数超轻量速度对比模型）"
    source_url: "https://huggingface.co/ggml-org/SmolLM2-135M-GGUF/resolve/main/SmolLM2-135M-Q4_K_M.gguf"
    version: "SmolLM2-135M-Q4_K_M"
    license: "Apache-2.0"
    sha256: "e3131339bf4e8065265593d4fd8f7bb7ff2d3abff1edb5618aa1197b89cad9f5"
    build_script: "scripts/data_pipeline/fetch_models.py"
    notes: "ggml-org 官方转换 Apache-2.0 GGUF，用于在相同 Radeon 780M Vulkan 环境下对比 135M 与 360M 的延迟与准确率"

  - id: cmudict
    status: ready
    description: "Carnegie Mellon Pronouncing Dictionary (CMUdict ARPAbet 音素发音词典)"
    source_url: "https://raw.githubusercontent.com/cmusphinx/cmudict/master/cmudict.dict"
    version: "master"
    license: "BSD-2-Clause"
    sha256: "81917843c7f44ce2b094ac63873c2c7a4cf802040792c455ba3ca406891c3d22"
    build_script: "scripts/data_pipeline/build_lexicon.py"
    notes: "官方 BSD-2-Clause 开源美式英语音素词典，写入 ANIMELEX phonetic 字段用于数据驱动的同音与近音词发现"

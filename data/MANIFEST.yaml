  - id: ngram-corpus
    status: ready
    description: "OpenSLR 11 LibriSpeech 规范化英文语言模型语料（源自 Public Domain Project Gutenberg 书库），统计 2-gram 与 3-gram 概率表（ANIMENGR）"
    source_url: "https://www.openslr.org/resources/11/librispeech-lm-norm.txt.gz"
    version: "openslr-11"
    license: "Public Domain"
    sha256: "927d47656638c2ca93566640e56bcbeb2aa4ca237b8490fe1eff7d6e610a53c7"
    build_script: "scripts/data_pipeline/build_ngram_kn.py"
    notes: "全量 4041 万行经 build_ngram_kn.py（Rust anime-ngram-build：插值修正 Kneser-Ney + 计数剪枝 + eval/** 整句与 5-gram 去泄漏）编译为 ANIMENGR v1。注意源文件按字母序排序，截断前 N 行会严重偏向以 A 开头的句子；旧 build_ngram.py --max-lines 仅保留作小规模测试"


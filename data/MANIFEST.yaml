# AnIME 100% 开源洁净数据源登记表（遵循 .agents/contracts/data-format.md）
version: 1

sources:
  - id: scowl
    status: ready
    description: "Spell Checker Oriented Word Lists — 规范英文词形基础表（含美/英拼写分级与屈折变化）"
    source_url: "https://downloads.sourceforge.net/project/wordlist/SCOWL/2020.12.07/scowl-2020.12.07.tar.gz"
    version: "2020.12.07"
    license: "MIT / BSD-like (SCOWL permissive custom)"
    sha256: "5587667caa20c4891390c2d42dbb4d5c4c3f41bee77af1457ece3ba23fb859cc"
    build_script: "scripts/data_pipeline/build_lexicon.py"
    notes: "过滤生僻词等级（默认 <= 70），作为合法英文词汇白名单基准，防止误词进入候选"

  - id: wordfreq-en
    status: ready
    description: "wordfreq English multi-source Zipf word frequencies（覆盖 Wikipedia / Reddit / Twitter / OpenSubtitles 等现代语料）"
    source_url: "https://files.pythonhosted.org/packages/py3/w/wordfreq/wordfreq-3.1.1-py3-none-any.whl"
    version: "3.1.1"
    license: "Apache-2.0 (code) / CC-BY-SA-4.0 (compiled frequency lists)"
    sha256: "4b1c6ecffc6198be3396d5cf871c4423ca71c907c231348d352dd54d62b97473"
    build_script: "scripts/data_pipeline/build_lexicon.py"
    notes: "提供现代词频并覆盖 kubernetes、chatgpt 等新词；通过纯标准库解包 wheel 内置 cBpack 词频表与 SCOWL 取交集与补丁"

  - id: wikipedia-common-misspellings
    status: ready
    description: "Wikipedia 公开常见英文人类拼写错误映射表（For_machines 固定快照，如 definately -> definitely）"
    source_url: "https://en.wikipedia.org/w/index.php?title=Wikipedia:Lists_of_common_misspellings/For_machines&oldid=1199637275&action=raw"
    version: "oldid-1199637275"
    license: "CC-BY-SA-4.0"
    sha256: "3b6a9290e5aaad968da7ec769a5174adb45247688ef7ae097fd2dd80237a3050"
    build_script: "scripts/data_pipeline/build_misspellings.py"
    notes: "明确排除 Birkbeck（CC-BY-NC-SA-3.0 非商用）；CC-BY-SA-4.0 仅用于独立可审查错拼词表并按 80/20 切分（train 入库 / eval 评测防泄漏）"

  - id: crate-ci-typos
    status: ready
    description: "crate-ci/typos 开源英文真实拼写错误词典 CSV（覆盖开发与通用场景常见错拼）"
    source_url: "https://raw.githubusercontent.com/crate-ci/typos/v1.32.0/crates/typos-dict/assets/words.csv"
    version: "v1.32.0"
    license: "MIT OR Apache-2.0"
    sha256: "3630b7c12bf3a860ec2b7bd9b7a5e2e992dbb09936359c292d3be2762f7bd30d"
    build_script: "scripts/data_pipeline/build_misspellings.py"
    notes: "采用确定性哈希按 80/20 切分：train 切分用于错拼库，eval 切分专用于离线真实错拼评测，零重合防泄漏"

